name: docker-dev

on:
  push:
    branches: [main, master, develop, dev]
  workflow_dispatch:

permissions:
  contents: read

# All branches publish the same tag, so they share one concurrency group.
concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build web frontend
        run: bash scripts/build-web.sh

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build Linux amd64 binary
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o baodou ./cmd/baodou

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ravenmk2/baodou:dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
